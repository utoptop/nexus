name: nexus-agent
services:
  nexus-agent:
    image: utoptop/nexus-agent:1.0
    build: .
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 20s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - agent-data:/var/lib/nexus-agent
    environment:
      SERVER_URL: ${SERVER_URL:?Set SERVER_URL in .env}
      AUTH_TOKEN: ${AUTH_TOKEN:?Set AUTH_TOKEN in .env}
      NODE_IP: ${NODE_IP:?Set NODE_IP in .env}
      BATCH_SIZE: ${BATCH_SIZE:-500}
      MONITOR_CONTAINERS: ${MONITOR_CONTAINERS:-auto}
      STATE_DIR: /var/lib/nexus-agent
      QUEUE_MAX_EVENTS: ${QUEUE_MAX_EVENTS:-50000}
      QUEUE_MAX_BYTES: ${QUEUE_MAX_BYTES:-67108864}
      NETWORK_INTERFACES: ${NETWORK_INTERFACES:-}
volumes:
  agent-data:
