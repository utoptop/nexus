name: nexus-agent
services:
  nexus-agent:
    image: utoptop/nexus-agent:1.0
    build:
      context: .
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 20s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - agent-data:/var/lib/nexus-agent
      - type: bind
        source: ./config/nexus-agent.toml
        target: /etc/nexus-agent/nexus-agent.toml
        read_only: true
        bind:
          create_host_path: false
volumes:
  agent-data:
