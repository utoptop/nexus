[package]
name = "nexus-agent"
version = "1.0.0"
edition = "2024"
repository = "https://github.com/utoptop/nexus"
description = "Nexus durable Docker access-log and node metrics collector"
rust-version = "1.93"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["rustls-tls"], default-features = false }
hyper = { version = "0.14", features = ["client", "http1", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.1" # MessagePack 二进制序列化终极利器
chrono = { version = "0.4", default-features = false, features = ["std"] }
httpdate = "1"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort" # 极致减小二进制文件体积
