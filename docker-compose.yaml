name: nexus
services:
  nexus:
    image: utoptop/nexus:1.0
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - type: bind
        source: ./config/nexus.toml
        target: /etc/nexus/nexus.toml
        read_only: true
        bind:
          create_host_path: false
      # Enable only after this optional file exists:
      # - ./geo-data/GeoLite2-City.mmdb:/app/GeoLite2-City.mmdb:ro
    secrets:
      - postgres_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nexus
  db:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    shm_size: 256mb
    # Fixed values required by the upstream database image; no .env is read.
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: nexus
    secrets:
      - postgres_password
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./config/postgresql.conf:/etc/postgresql/nexus.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 20
    command: ["postgres", "-c", "config_file=/etc/postgresql/nexus.conf"]
    networks:
      - nexus
networks:
  nexus:
secrets:
  postgres_password:
    file: ./config/postgres-password
