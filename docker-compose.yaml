name: nexus
services:
  nexus:
    image: utoptop/nexus:1.0
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "${NEXUS_BIND:-127.0.0.1}:${NEXUS_PORT:-3001}:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://nexus:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/nexus
    # Optional local GeoLite2 City database; enable only after the file exists.
    # volumes:
    #   - ./geo-data/GeoLite2-City.mmdb:/app/GeoLite2-City.mmdb:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nexus
  db:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: nexus
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-80}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-512MB}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
    networks:
      - nexus
networks:
  nexus:
