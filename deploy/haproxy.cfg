# Standalone example. Merge the relevant sections into an existing HAProxy config.
# Replace domains, certificate path and upstream address before use.
global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    timeout http-request 10s
    timeout http-keep-alive 60s

frontend nexus_http
    bind :80
    http-request redirect scheme https code 301

frontend nexus_https
    bind :443 ssl crt /etc/haproxy/certs/nexus.pem alpn h2,http/1.1
    # Direct client connections. Adapt real-IP handling if another trusted proxy precedes HAProxy.
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-For %[src]
    acl nexus_host hdr(host) -i nexus.example.com origin.example.com nexus.example.com:443 origin.example.com:443
    # Keep this before any generic WebSocket routing rule in a shared frontend.
    use_backend bk_nexus if nexus_host

backend bk_nexus
    mode http
    http-reuse always
    timeout tunnel 1h
    # Host HAProxy: published application port. Shared Docker network: nexus:3000.
    server nexus 127.0.0.1:3001 proto h1 check inter 2s fall 3 rise 2

# Host and Origin are preserved; auth.allowed_origins in nexus.toml lists trusted aliases.
# All paths, including /admin/ws and /api/track_batch, reach the same application.
