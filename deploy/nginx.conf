# Include from nginx.conf's http {} context. Replace domains and certificate paths.
map $http_upgrade $nexus_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name nexus.example.com origin.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name nexus.example.com origin.example.com;
    ssl_certificate /etc/letsencrypt/live/nexus.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexus.example.com/privkey.pem;
    location / {
        # Host Nginx: published application port. Shared Docker network: nexus:3000.
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nexus_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 1m;
    }
}
